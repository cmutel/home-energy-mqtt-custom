# Replaces /etc/nginx/sites-available/default on the Pi.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Dashboards (static HTML, query Datasette from the browser)
    location /dashboards/ {
        alias /home/cmutel/dorfsteig/dashboards/;
        index status.html;
    }

    # Datasette API and UI
    location /datasette/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Everything else is unchanged: the legacy controller writes
    # upstairs.json, downstairs.json and status.json here, and the
    # ESP32 boards fetch them by these exact URLs.
    location / {
        root /home/cmutel/Web/;
    }
}
