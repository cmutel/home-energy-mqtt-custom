# Replaces /etc/nginx/sites-available/default on the Pi.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = / {
        return 302 /heating/;
    }

    # Heating controller: ESP32 board files, legacy status.json and the web UI.
    # If the controller is down nginx answers 502 quickly, and the boards
    # fall back to their built-in defaults (water heaters on).
    location ~ ^/(upstairs|downstairs|status)\.json$ {
        proxy_pass            http://127.0.0.1:8002;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
    }
    location /heating/ {
        proxy_pass         http://127.0.0.1:8002;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Dashboards (static HTML, query Datasette from the browser)
    location /dashboards/ {
        alias /home/cmutel/dorfsteig/dashboards/;
        index status.html;
    }

    # Datasette API and UI
    location /datasette/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Everything else (dust.html etc.) from the old web root
    location / {
        root /home/cmutel/Web/;
    }
}
