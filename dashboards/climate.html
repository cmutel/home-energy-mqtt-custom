<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Air Quality — Home Energy</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="pico.min.css">
  <link rel="stylesheet" href="dashboards.css">
</head>
<body>
<main class="container">
  <nav>
    <ul><li><strong>Dorfsteig dashboards</strong></li></ul>
    <ul>
      <li><a href="/heating/">Heating</a></li>
      <li><a href="daily.html">Daily consumption</a></li>
      <li><a href="power.html">Solar &amp; grid</a></li>
      <li><a href="energy.html">Energy &amp; costs</a></li>
      <li><a href="climate.html" aria-current="page">Air quality</a></li>
      <li><a href="learning.html">Learning</a></li>
      <li><a href="realtime.html">Real time</a></li>
      <li><a href="status.html">Status</a></li>
    </ul>
  </nav>
  <h1>Air Quality</h1>
  <div class="controls">
    <label for="day">Day</label>
    <button id="prev" class="outline">&#9664;</button>
    <input type="date" id="day" value="">
    <button id="next" class="outline">&#9654;</button>
    <span id="status"></span>
  </div>
  <div id="chart-temp"  class="chart"></div>
  <div id="chart-pm"    class="chart"></div>

  <script>
    const API = '/datasette';
    const ROOMS = ['balkon', 'küchen'];
    const COLORS = { balkon: '#4c78a8', 'küchen': '#f58518' };

    const dayInput = document.getElementById('day');
    const status   = document.getElementById('status');

    async function load(day) {
      status.textContent = 'Loading…';

      const sql = `
        SELECT
          datetime(ts, 'unixepoch', 'localtime') AS time,
          room, temperature, humidity, pm25, pm10
        FROM air_quality
        WHERE ts >= CAST(strftime('%s', '${day}', 'utc') AS INTEGER)
        AND ts < CAST(strftime('%s', '${day}', '+1 day', 'utc') AS INTEGER)
        ORDER BY ts
      `;
      const url = `${API}/dorfsteig.json?sql=${encodeURIComponent(sql)}&_shape=array`;

      let rows;
      try {
        const resp = await fetch(url);
        rows = await resp.json();
      } catch (e) {
        status.textContent = `Error: ${e.message}`;
        return;
      }

      if (!Array.isArray(rows) || rows.length === 0) {
        status.textContent = 'No data for this day.';
        Plotly.purge('chart-temp');
        Plotly.purge('chart-pm');
        return;
      }

      const byRoom = {};
      for (const r of rows) {
        (byRoom[r.room] = byRoom[r.room] || []).push(r);
      }

      renderTemp(byRoom);
      renderPM(byRoom);
      status.textContent = `${rows.length} readings`;
    }

    function roomRows(byRoom, room) {
      return byRoom[room] || [];
    }

    function renderTemp(byRoom) {
      const traces = [];
      for (const room of ROOMS) {
        const rows = roomRows(byRoom, room);
        const label = room.charAt(0).toUpperCase() + room.slice(1);
        traces.push({
          x: rows.map(r => r.time), y: rows.map(r => r.temperature),
          name: `${label} — temperature`,
          mode: 'lines', yaxis: 'y1',
          line: { color: COLORS[room], width: 1.5 },
          hovertemplate: '%{y:.1f}°C<extra>' + label + '</extra>',
        });
        traces.push({
          x: rows.map(r => r.time), y: rows.map(r => r.humidity),
          name: `${label} — humidity`,
          mode: 'lines', yaxis: 'y2',
          line: { color: COLORS[room], width: 1.5, dash: 'dot' },
          hovertemplate: '%{y:.1f}%<extra>' + label + ' humidity</extra>',
        });
      }

      Plotly.react('chart-temp', traces, {
        yaxis:  { title: 'Temperature (°C)' },
        yaxis2: { title: 'Humidity (%)', overlaying: 'y', side: 'right', rangemode: 'tozero' },
        xaxis:  { type: 'date' },
        hovermode: 'x unified',
        legend: {},
        margin: { t: 20, r: 80, b: 60, l: 70 },
        height: 320,
      });
    }

    function renderPM(byRoom) {
      const traces = [];
      for (const room of ROOMS) {
        const rows = roomRows(byRoom, room);
        const label = room.charAt(0).toUpperCase() + room.slice(1);
        traces.push({
          x: rows.map(r => r.time), y: rows.map(r => r.pm25),
          name: `${label} — PM2.5`,
          mode: 'lines',
          line: { color: COLORS[room], width: 1.5 },
          hovertemplate: '%{y:.2f} µg/m³<extra>' + label + ' PM2.5</extra>',
        });
        traces.push({
          x: rows.map(r => r.time), y: rows.map(r => r.pm10),
          name: `${label} — PM10`,
          mode: 'lines',
          line: { color: COLORS[room], width: 1.5, dash: 'dot' },
          hovertemplate: '%{y:.2f} µg/m³<extra>' + label + ' PM10</extra>',
        });
      }

      Plotly.react('chart-pm', traces, {
        yaxis:  { title: 'Particulates (µg/m³)', rangemode: 'tozero' },
        xaxis:  { type: 'date' },
        hovermode: 'x unified',
        legend: {},
        margin: { t: 20, r: 20, b: 60, l: 70 },
        height: 320,
      });
    }

    function formatLocalDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function shiftDay(delta) {
      const d = new Date(dayInput.value + 'T00:00:00');
      d.setDate(d.getDate() + delta);
      dayInput.value = formatLocalDate(d);
      load(dayInput.value);
    }

    dayInput.addEventListener('change', () => load(dayInput.value));
    document.getElementById('prev').addEventListener('click', () => shiftDay(-1));
    document.getElementById('next').addEventListener('click', () => shiftDay(+1));

    dayInput.value = formatLocalDate(new Date());
    load(dayInput.value);
  </script>
</main>
</body>
</html>
