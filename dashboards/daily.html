<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Daily Energy — Home Energy</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="pico.min.css">
  <link rel="stylesheet" href="dashboards.css">
</head>
<body>
<main class="container">
  <nav>
    <ul><li><strong>Dorfsteig dashboards</strong></li></ul>
    <ul>
      <li><a href="/heating/">Heating</a></li>
      <li><a href="daily.html" aria-current="page">Daily consumption</a></li>
      <li><a href="power.html">Solar &amp; grid</a></li>
      <li><a href="energy.html">Energy &amp; costs</a></li>
      <li><a href="climate.html">Air quality</a></li>
      <li><a href="learning.html">Learning</a></li>
      <li><a href="status.html">Status</a></li>
    </ul>
  </nav>
  <h1>Daily Energy Consumption</h1>
  <div class="controls">
    <label for="day">Day</label>
    <button id="prev" class="outline">&#9664;</button>
    <input type="date" id="day" value="">
    <button id="next" class="outline">&#9654;</button>
    <span id="status"></span>
  </div>
  <div id="chart"></div>
  <div id="totals"></div>

  <script>
    const API = '/datasette';

    // Channels grouped for legend organisation.
    // Click a group title to toggle the whole group; click individual items to toggle one line.
    const GROUPS = {
      'Mains':      ['mains_a', 'mains_b'],
      'Heating':    ['zone_a', 'zone_b', 'zone_c', 'zone_d', 'zone_e', 'zone_f'],
      'Appliances': ['oven', 'stovetop', 'clothes_washer', 'clothes_dryer', 'water_heater', 'dishwasher'],
      'Upstairs':   ['upstairs_water', 'upstairs_other'],
    };

    // The upstairs panel isn't measured: upstairs = whole house (MBMD) - downstairs panel
    // (IoTaWatt), and its water heater is estimated from switching steps (see energy.py).
    const SQL = {
      upstairs_water: 'h.upstairs_water',
      upstairs_other: 'h.upstairs_other',
    };

    const LABELS = {
      zone_a: 'Kitchen / bathroom / dining room',
      zone_b: 'Hallway / living room / entrance / outside',
      zone_c: 'Upstairs bathroom / parents / playroom south',
      zone_d: 'Upstairs hallway',
      zone_e: 'Kids bedroom / playroom north / balcony',
      water_heater: 'Downstairs water heater',
      upstairs_water: 'Upstairs water heater (estimated)',
      upstairs_other: 'Upstairs other (heating, lights, office, bedrooms)',
    };

    const CHANNELS = Object.entries(GROUPS).flatMap(([group, names]) =>
      names.map(name => ({ name, group }))
    );

    const dayInput = document.getElementById('day');
    const status   = document.getElementById('status');

    async function load(day) {
      status.textContent = 'Loading…';
      const cols = CHANNELS.map(c => `${SQL[c.name] ?? 'i.' + c.name} AS ${c.name}`).join(', ');
      const sql = `
        SELECT datetime(i.ts, 'unixepoch', 'localtime') AS time, ${cols}
        FROM iotawatt_readings i
        LEFT JOIN house_minutes h ON h.ts = i.ts
        WHERE i.ts >= CAST(strftime('%s', '${day}', 'utc') AS INTEGER)
        AND i.ts < CAST(strftime('%s', '${day}', '+1 day', 'utc') AS INTEGER)
        ORDER BY i.ts
      `;
      const url = `${API}/dorfsteig.json?sql=${encodeURIComponent(sql)}&_shape=array`;

      let rows;
      try {
        const resp = await fetch(url);
        rows = await resp.json();
      } catch (e) {
        status.textContent = `Error: ${e.message}`;
        return;
      }

      if (!Array.isArray(rows) || rows.length === 0) {
        status.textContent = 'No data for this day.';
        Plotly.purge('chart');
        Plotly.purge('totals');
        return;
      }

      const times = rows.map(r => r.time);

      const HIDDEN_BY_DEFAULT = new Set(['mains_a', 'mains_b']);

      const traces = CHANNELS.map(({ name }) => ({
        x: times,
        y: rows.map(r => r[name]),
        name: LABELS[name] ?? name.replace(/_/g, '\u00a0'),
        type: 'scatter',
        mode: 'lines',
        line: { width: 1.5 },
        visible: HIDDEN_BY_DEFAULT.has(name) ? 'legendonly' : true,
        hovertemplate: '%{y:.0f} W<extra>%{fullData.name}</extra>',
      }));

      Plotly.react('chart', traces, {
        xaxis: { type: 'date', title: 'Time' },
        yaxis: { title: 'Power (W)', rangemode: 'tozero' },
        legend: {},
        hovermode: 'x unified',
        margin: { t: 20, r: 20, b: 60, l: 70 },
        height: 580,
      });

      renderTotals(rows);
      status.textContent = `${rows.length} readings`;
    }

    // Sum watts over all one-minute readings → Wh (÷60), display as kWh
    const TOTALS = [
      { label: 'Heating',       fields: ['zone_a', 'zone_b', 'zone_c', 'zone_d', 'zone_e', 'zone_f'] },
      { label: 'Water heater downstairs', fields: ['water_heater'] },
      { label: 'Water heater upstairs (est.)', fields: ['upstairs_water'] },
      { label: 'Upstairs other', fields: ['upstairs_other'] },
      { label: 'Clothes dryer', fields: ['clothes_dryer'] },
      { label: 'Oven',          fields: ['oven'] },
      { label: 'Clothes washer',fields: ['clothes_washer'] },
      { label: 'Dishwasher',    fields: ['dishwasher'] },
      { label: 'Stovetop',      fields: ['stovetop'] },
    ];

    function renderTotals(rows) {
      const entries = TOTALS.map(({ label, fields }) => {
        const wh = rows.reduce((sum, r) => sum + fields.reduce((s, f) => s + (r[f] || 0), 0), 0) / 60;
        return { label, kwh: wh / 1000 };
      }).sort((a, b) => b.kwh - a.kwh);

      Plotly.react('totals', [{
        type: 'bar',
        orientation: 'h',
        x: entries.map(e => e.kwh),
        y: entries.map(e => e.label),
        text: entries.map(e => `${e.kwh.toFixed(2)} kWh`),
        textposition: 'outside',
        hovertemplate: '%{x:.3f} kWh<extra>%{y}</extra>',
        marker: { color: '#4c78a8' },
      }], {
        xaxis: { title: 'kWh', rangemode: 'tozero' },
        margin: { t: 20, r: 100, b: 50, l: 190 },
        height: 340,
      });
    }

    function formatLocalDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function shiftDay(delta) {
      const d = new Date(dayInput.value + 'T00:00:00');
      d.setDate(d.getDate() + delta);
      dayInput.value = formatLocalDate(d);
      load(dayInput.value);
    }

    dayInput.addEventListener('change', () => load(dayInput.value));
    document.getElementById('prev').addEventListener('click', () => shiftDay(-1));
    document.getElementById('next').addEventListener('click', () => shiftDay(+1));

    dayInput.value = formatLocalDate(new Date());
    load(dayInput.value);
  </script>
</main>
</body>
</html>
