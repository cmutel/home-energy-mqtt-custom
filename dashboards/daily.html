<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Daily Energy — Home Energy</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="pico.min.css">
  <link rel="stylesheet" href="dashboards.css">
  <script src="channels.js"></script>
</head>
<body>
<main class="container">
  <nav>
    <ul><li><strong>Dorfsteig dashboards</strong></li></ul>
    <ul>
      <li><a href="/heating/">Heating</a></li>
      <li><a href="daily.html" aria-current="page">Daily consumption</a></li>
      <li><a href="power.html">Solar &amp; grid</a></li>
      <li><a href="energy.html">Energy &amp; costs</a></li>
      <li><a href="climate.html">Air quality</a></li>
      <li><a href="learning.html">Learning</a></li>
      <li><a href="realtime.html">Real time</a></li>
      <li><a href="status.html">Status</a></li>
    </ul>
  </nav>
  <h1>Daily Energy Consumption</h1>
  <div class="controls">
    <label for="day">Day</label>
    <button id="prev" class="outline">&#9664;</button>
    <input type="date" id="day" value="">
    <button id="next" class="outline">&#9654;</button>
    <span id="status"></span>
  </div>
  <div id="chart"></div>
  <div id="totals"></div>

  <script>
    const API = '/datasette';

    // Lines drawn, by legend group (names in channels.js). Click a group title in the
    // legend to show or hide the whole group, or a single entry to toggle one line.
    const CHANNELS = CIRCUIT_GROUPS
      .filter(group => group.title !== 'Supply')
      .flatMap(group => Object.keys(group.circuits).map(name => ({ name, group: group.title })));

    // Not a column: worked out from the relays below (splitUpstairs)
    const DERIVED = new Set(['upstairs_heating']);

    // How to read each line. Two-phase loads draw twice their channel. The upstairs panel
    // isn't measured: upstairs = whole house (MBMD) - downstairs panel (IoTaWatt), and its
    // water heater is estimated from switching steps (see energy.py). Its room heaters are
    // estimated from the relays and taken out of "upstairs other" (splitUpstairs).
    const SQL = {
      water_heater: 'i.water_heater * 2',
      oven: 'i.oven * 2',
      stovetop: 'i.stovetop * 2',
      upstairs_water: 'h.upstairs_water',
      upstairs_other: 'h.upstairs_other',
    };

    const dayInput = document.getElementById('day');
    const status   = document.getElementById('status');

    async function query(sql) {
      const url = `${API}/dorfsteig.json?sql=${encodeURIComponent(sql)}&_shape=array`;
      const resp = await fetch(url);
      return resp.json();
    }

    // The upstairs room heaters aren't measured, so "upstairs other" includes them. Their
    // share is estimated from the controller's relay switches (control_events) × each
    // heater's estimated power (the heating UI's /heating/api/status, today's estimate also
    // for past days), and never more than upstairs used in that minute. A heater whose last
    // wattage test found no load (switched off by hand) counts as 0. That's an upper bound:
    // a storage heater with a full core draws nothing although its relay is on.
    async function upstairsHeaters() {
      const resp = await fetch('/heating/api/status');
      const s = await resp.json();
      return s.heaters
        .filter(h => h.board === 'upstairs' && !h.water)
        .map(h => ({ id: h.id, watts: h.no_load ? 0 : h.watts }));
    }

    // heater → [[on, off], ...] in Unix seconds, within start–end. null if the controller
    // has no switches for these heaters up to `end` (before it ran, 2026-10-11).
    async function relaySpans(heaters, start, end) {
      const ids = heaters.map(h => `'${h.id}'`).join(', ');
      const events = await query(`
        SELECT heater, ts, is_on FROM control_events e
        WHERE dry_run = 0 AND heater IN (${ids}) AND ts < ${end}
        AND ts >= (SELECT COALESCE(MAX(ts), 0) FROM control_events p
                   WHERE p.heater = e.heater AND p.dry_run = 0 AND p.ts < ${start})
        ORDER BY ts`);
      if (!events.length) return null;
      const spans = {};
      const onSince = {};
      for (const { heater, ts, is_on } of events) {
        spans[heater] ??= [];
        if (is_on && onSince[heater] == null) {
          onSince[heater] = Math.max(ts, start);
        } else if (!is_on && onSince[heater] != null) {
          spans[heater].push([onSince[heater], ts]);
          onSince[heater] = null;
        }
      }
      for (const [heater, since] of Object.entries(onSince)) {
        if (since != null) spans[heater].push([since, end]);
      }
      return spans;
    }

    // Adds upstairs_heating to each row and takes it out of upstairs_other.
    // Returns false if it can't be estimated (then upstairs_other is left as it is).
    async function splitUpstairs(rows, start, end) {
      let heaters, spans;
      try {
        heaters = await upstairsHeaters();
        spans = await relaySpans(heaters, start, end);
      } catch (e) {
        return false;
      }
      if (!spans) return false;
      for (const r of rows) {
        let relays = 0;
        for (const h of heaters) {
          if ((spans[h.id] || []).some(([on, off]) => on <= r.ts && r.ts < off)) relays += h.watts;
        }
        if (r.upstairs_other == null) {
          r.upstairs_heating = null;
        } else {
          r.upstairs_heating = Math.min(relays, Math.max(r.upstairs_other, 0));
          r.upstairs_other -= r.upstairs_heating;
        }
      }
      return true;
    }

    async function load(day) {
      status.textContent = 'Loading…';
      const cols = CHANNELS
        .filter(c => !DERIVED.has(c.name))
        .map(c => `${SQL[c.name] ?? 'i.' + c.name} AS ${c.name}`).join(', ');
      const sql = `
        SELECT i.ts AS ts, datetime(i.ts, 'unixepoch', 'localtime') AS time, ${cols}
        FROM iotawatt_readings i
        LEFT JOIN house_minutes h ON h.ts = i.ts
        WHERE i.ts >= CAST(strftime('%s', '${day}', 'utc') AS INTEGER)
        AND i.ts < CAST(strftime('%s', '${day}', '+1 day', 'utc') AS INTEGER)
        ORDER BY i.ts
      `;

      let rows;
      try {
        rows = await query(sql);
      } catch (e) {
        status.textContent = `Error: ${e.message}`;
        return;
      }

      if (!Array.isArray(rows) || rows.length === 0) {
        status.textContent = 'No data for this day.';
        Plotly.purge('chart');
        Plotly.purge('totals');
        return;
      }

      const times = rows.map(r => r.time);
      const start = new Date(day + 'T00:00:00').getTime() / 1000;
      const end = new Date(day + 'T00:00:00');
      end.setDate(end.getDate() + 1);
      const split = await splitUpstairs(rows, start, end.getTime() / 1000);

      const HIDDEN_BY_DEFAULT = new Set(['mains_a', 'mains_b']);

      const traces = CHANNELS.filter(c => split || !DERIVED.has(c.name)).map(({ name, group }) => ({
        x: times,
        y: rows.map(r => r[name]),
        name: circuitLabel(name),
        legendgroup: group,
        legendgrouptitle: { text: group },
        type: 'scatter',
        mode: 'lines',
        line: { width: 1.5 },
        visible: HIDDEN_BY_DEFAULT.has(name) ? 'legendonly' : true,
        hovertemplate: '%{y:.0f} W<extra>%{fullData.name}</extra>',
      }));

      Plotly.react('chart', traces, {
        xaxis: { type: 'date', title: 'Time' },
        yaxis: { title: 'Power (W)', rangemode: 'tozero' },
        legend: { groupclick: 'toggleitem' },
        hovermode: 'x unified',
        margin: { t: 20, r: 20, b: 60, l: 70 },
        height: 580,
      });

      renderTotals(rows, split);
      status.textContent = `${rows.length} readings` +
        (split ? '' : ' · upstairs heating not split out (no relay data for this day)');
    }

    // Sum watts over all one-minute readings → Wh (÷60), display as kWh
    const TOTALS = [
      { label: 'Zones A–F', fields: ['zone_a', 'zone_b', 'zone_c', 'zone_d', 'zone_e', 'zone_f'] },
      ...['water_heater', 'upstairs_water', 'upstairs_heating', 'upstairs_other', 'clothes_dryer', 'oven',
          'clothes_washer', 'dishwasher', 'stovetop'].map(name => ({ label: circuitLabel(name), fields: [name] })),
    ];
    const BAR_COLOUR = '#4c78a8';
    const HEATING_COLOUR = '#f58518';   // as space heating in the heating UI

    function renderTotals(rows, split) {
      const entries = TOTALS
        .filter(({ fields }) => split || !fields.some(f => DERIVED.has(f)))
        .map(({ label, fields }) => {
          const wh = rows.reduce((sum, r) => sum + fields.reduce((s, f) => s + (r[f] || 0), 0), 0) / 60;
          return { label, kwh: wh / 1000, heating: fields.includes('upstairs_heating') };
        })
        .sort((a, b) => b.kwh - a.kwh);

      Plotly.react('totals', [{
        type: 'bar',
        orientation: 'h',
        x: entries.map(e => e.kwh),
        y: entries.map(e => e.label),
        text: entries.map(e => `${e.kwh.toFixed(2)} kWh`),
        textposition: 'outside',
        hovertemplate: '%{x:.3f} kWh<extra>%{y}</extra>',
        marker: { color: entries.map(e => e.heating ? HEATING_COLOUR : BAR_COLOUR) },
      }], {
        xaxis: { title: 'kWh', rangemode: 'tozero' },
        margin: { t: 20, r: 100, b: 50, l: 250 },
        height: 340,
      });
    }

    function formatLocalDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function shiftDay(delta) {
      const d = new Date(dayInput.value + 'T00:00:00');
      d.setDate(d.getDate() + delta);
      dayInput.value = formatLocalDate(d);
      load(dayInput.value);
    }

    dayInput.addEventListener('change', () => load(dayInput.value));
    document.getElementById('prev').addEventListener('click', () => shiftDay(-1));
    document.getElementById('next').addEventListener('click', () => shiftDay(+1));

    dayInput.value = formatLocalDate(new Date());
    load(dayInput.value);
  </script>
</main>
</body>
</html>
